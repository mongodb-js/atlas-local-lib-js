name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'

run-name: "Release: ${{ inputs.version || github.ref_name }}"

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing

env:
  DEBUG: napi:*
  APP_NAME: atlas-local
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  # Keep in sync with CARGO_ABOUT_VERSION in CI.yml
  CARGO_ABOUT_VERSION: 0.8.4

jobs:
  update-version:
    if: github.event_name == 'workflow_dispatch'
    name: Update Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Set Apix Bot token
        id: app-token
        uses: mongodb/apix-action/token@ca63bdc0f33a15da45755eb6a54c072ba65d3923
        with:
          app-id: ${{ secrets.APIXBOT_APP_ID }}
          private-key: ${{ secrets.APIXBOT_APP_PEM }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Install dependencies
        run: yarn install
      - name: Install cargo tools for license verification
        run: |
          cargo install --locked --version ${{ env.CARGO_ABOUT_VERSION }} cargo-about
      - name: Update package.json version
        id: set-version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          npm version "$INPUT_VERSION" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Update Cargo.toml version
        env:
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - name: Update third-party licenses
        run: |
          cargo about generate --frozen about.hbs > LICENSE-3RD-PARTY.txt
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.set-version.outputs.version }} --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Build to update generated files
        run: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
      - name: Create release pull request
        id: create-release-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          committer: >-
            ${{ steps.app-token.outputs.user-name }}
            <${{ steps.app-token.outputs.user-email }}>
          author: >-
            ${{ steps.app-token.outputs.user-name }}
            <${{ steps.app-token.outputs.user-email }}>
          add-paths: |
            package.json
            Cargo.toml
            Cargo.lock
            index.js
            index.d.ts
            CHANGELOG.md
            LICENSE-3RD-PARTY.txt
          title: >-
            chore(release): prepare for ${{ steps.set-version.outputs.version }}
          commit-message: >-
            chore(release): prepare for ${{ steps.set-version.outputs.version }}
          branch: "release/prepare-v${{ steps.set-version.outputs.version }}"
          base: main
          body: >-
            Prepare the ${{ steps.set-version.outputs.version }} release.

            Review and approve this PR. Auto-merge will complete it after
            required checks pass. Merging triggers the Tag Release workflow.
      - name: Request Jira ticket
        if: steps.create-release-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-release-pr.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label create_jira
      - name: Enable auto-merge
        if: steps.create-release-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.create-release-pr.outputs.pull-request-number }}
        run: |
          if [ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash
          fi

  build:
    if: github.event_name == 'push'
    name: Build Release
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: windows-latest
            build: yarn build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn build --target aarch64-unknown-linux-gnu --use-napi-cross
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2.90.8
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      # Ensure npm 11.5.1 or later is installed
      # Required for trusted publishing: https://docs.npmjs.com/trusted-publishers
      - name: Update npm
        run: npm install -g npm@latest
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --verbose --latest
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Install dependencies
        run: yarn install
      - name: Create npm dirs
        run: yarn napi create-npm-dirs
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Move artifacts
        run: yarn artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/bindings-*/*.node
            index.js
            index.d.ts
            LICENSE
            LICENSE-3RD-PARTY.txt
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to NPM
        run: |
          npm config set provenance true
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing stable release to latest tag"
            npm publish --access public
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "Publishing pre-release to next tag"
            npm publish --tag next --access public
          else
            echo "Invalid release tag format: '$GITHUB_REF_NAME'"
            echo "Expected format: X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi
